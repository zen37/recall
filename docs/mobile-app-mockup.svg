<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .phone { fill:#ffffff; stroke:#e3e3e6; stroke-width:2; }
      .screen { fill:#f7f7f8; }
      .bar { fill:#2563eb; }
      .ink { fill:#1a1a1a; }
      .muted { fill:#6b7280; }
      .chip { fill:#eef2ff; }
      .accent { fill:#2563eb; }
      .card { fill:#ffffff; stroke:#e3e3e6; stroke-width:1.5; }
      .warn { fill:#fdecec; stroke:#f3b4b4; stroke-width:1.5; }
      .step { fill:#111827; font-weight:700; }
    </style>
  </defs>

  <rect width="1040" height="660" fill="#ffffff"/>
  <text x="40" y="44" class="ink" font-size="26" font-weight="700">Mobile app — concept</text>
  <text x="40" y="72" class="muted" font-size="15">Scan a receipt → items become watchlist terms → new recalls are matched and pushed to you.</text>

  <!-- ============ PHONE 1 : capture ============ -->
  <g transform="translate(40,100)">
    <rect class="phone" x="0" y="0" width="280" height="500" rx="34"/>
    <rect class="screen" x="12" y="44" width="256" height="444" rx="8"/>
    <rect x="98" y="20" width="84" height="12" rx="6" fill="#e3e3e6"/>
    <!-- header -->
    <text x="140" y="80" text-anchor="middle" class="ink" font-size="16" font-weight="700">Scan receipt</text>
    <!-- receipt -->
    <rect x="78" y="104" width="124" height="196" rx="6" fill="#ffffff" stroke="#d6d6da" stroke-width="1.5"/>
    <text x="140" y="128" text-anchor="middle" class="muted" font-size="10" font-weight="700">GROCERY MART</text>
    <line x1="92" y1="142" x2="188" y2="142" stroke="#ececef" stroke-width="6"/>
    <line x1="92" y1="158" x2="188" y2="158" stroke="#ececef" stroke-width="6"/>
    <line x1="92" y1="174" x2="172" y2="174" stroke="#ececef" stroke-width="6"/>
    <line x1="92" y1="190" x2="188" y2="190" stroke="#ececef" stroke-width="6"/>
    <line x1="92" y1="206" x2="160" y2="206" stroke="#ececef" stroke-width="6"/>
    <line x1="92" y1="222" x2="188" y2="222" stroke="#ececef" stroke-width="6"/>
    <line x1="92" y1="238" x2="150" y2="238" stroke="#ececef" stroke-width="6"/>
    <line x1="92" y1="266" x2="188" y2="266" stroke="#d6d6da" stroke-width="6"/>
    <!-- capture guides -->
    <path d="M66 96 v-12 h14" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M214 96 v-12 h-14" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M66 308 v12 h14" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M214 308 v12 h-14" fill="none" stroke="#2563eb" stroke-width="3"/>
    <!-- shutter -->
    <circle cx="140" cy="440" r="26" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="140" cy="440" r="16" class="accent"/>
  </g>
  <text x="180" y="628" text-anchor="middle" class="step" font-size="15">1 · Snap your receipt</text>

  <!-- ============ PHONE 2 : saved ============ -->
  <g transform="translate(380,100)">
    <rect class="phone" x="0" y="0" width="280" height="500" rx="34"/>
    <rect class="screen" x="12" y="44" width="256" height="444" rx="8"/>
    <rect x="98" y="20" width="84" height="12" rx="6" fill="#e3e3e6"/>
    <text x="140" y="80" text-anchor="middle" class="ink" font-size="16" font-weight="700">Added to watchlist</text>
    <text x="140" y="100" text-anchor="middle" class="muted" font-size="11">4 items from your receipt</text>
    <!-- items -->
    <g font-size="12">
      <rect x="26" y="120" width="228" height="54" rx="10" class="card"/>
      <circle cx="50" cy="147" r="10" class="accent"/><path d="M45 147 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>
      <text x="70" y="143" class="ink" font-weight="600">Boar's Head Pecorino</text>
      <text x="70" y="160" class="muted">tracked</text>

      <rect x="26" y="184" width="228" height="54" rx="10" class="card"/>
      <circle cx="50" cy="211" r="10" class="accent"/><path d="M45 211 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>
      <text x="70" y="207" class="ink" font-weight="600">Romaine lettuce</text>
      <text x="70" y="224" class="muted">tracked</text>

      <rect x="26" y="248" width="228" height="54" rx="10" class="card"/>
      <circle cx="50" cy="275" r="10" class="accent"/><path d="M45 275 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>
      <text x="70" y="271" class="ink" font-weight="600">Cream cheese</text>
      <text x="70" y="288" class="muted">tracked</text>

      <rect x="26" y="312" width="228" height="54" rx="10" class="card"/>
      <circle cx="50" cy="339" r="10" class="accent"/><path d="M45 339 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>
      <text x="70" y="335" class="ink" font-weight="600">Ground turkey</text>
      <text x="70" y="352" class="muted">tracked</text>
    </g>
    <rect x="26" y="418" width="228" height="40" rx="10" class="chip"/>
    <text x="140" y="443" text-anchor="middle" class="accent" font-size="12" font-weight="700">Saved to Lakebase watchlist</text>
  </g>
  <text x="520" y="628" text-anchor="middle" class="step" font-size="15">2 · Items saved</text>

  <!-- ============ PHONE 3 : alert ============ -->
  <g transform="translate(720,100)">
    <rect class="phone" x="0" y="0" width="280" height="500" rx="34"/>
    <rect class="screen" x="12" y="44" width="256" height="444" rx="8"/>
    <rect x="98" y="20" width="84" height="12" rx="6" fill="#e3e3e6"/>
    <!-- push notification -->
    <rect x="26" y="66" width="228" height="72" rx="12" class="warn"/>
    <text x="44" y="92" font-size="18">⚠️</text>
    <text x="72" y="90" class="ink" font-size="12.5" font-weight="700">Recall match</text>
    <text x="72" y="108" class="muted" font-size="11">A product you track was recalled</text>
    <text x="72" y="126" class="muted" font-size="11">Romaine lettuce · Class I</text>
    <!-- detail card -->
    <text x="140" y="176" text-anchor="middle" class="ink" font-size="15" font-weight="700">New recall</text>
    <rect x="26" y="196" width="228" height="150" rx="12" class="card"/>
    <rect x="42" y="214" width="52" height="20" rx="10" class="chip"/>
    <text x="68" y="228" text-anchor="middle" class="accent" font-size="10" font-weight="700">Class I</text>
    <text x="42" y="262" class="ink" font-size="12.5" font-weight="700">Romaine lettuce, bagged</text>
    <text x="42" y="284" class="muted" font-size="11">Fresh Farms Inc · 2026-08-06</text>
    <text x="42" y="312" class="muted" font-size="11">Possible Listeria monocytogenes</text>
    <text x="42" y="330" class="muted" font-size="11">contamination.</text>
    <rect x="26" y="366" width="228" height="40" rx="10" class="accent"/>
    <text x="140" y="391" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">View recall</text>
  </g>
  <text x="860" y="628" text-anchor="middle" class="step" font-size="15">3 · Monitored automatically</text>
</svg>
